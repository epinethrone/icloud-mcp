<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t"><title id="t">iCloud MCP. Your iCloud, in Claude.</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif}</style>

<defs>
  <radialGradient id="glow" cx="0.5" cy="0.34" r="0.5">
    <stop offset="0" stop-color="#312e81" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#312e81" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0ea5e9"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/>
  </linearGradient>
</defs>
<rect width="1280" height="600" rx="36" fill="#000000"/>
<ellipse cx="640" cy="200" rx="420" ry="240" fill="url(#glow)"/>
<svg x="572" y="64" width="136" height="136" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="logo-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logo-node" gradientUnits="userSpaceOnUse" x1="185" y1="195" x2="340" y2="342">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="logo-soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#logo-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#logo-shine)"/>

  <!-- cloud: built from overlapping round shapes, not Apple's glyph -->
  <g filter="url(#logo-soft)" fill="#ffffff">
    <circle cx="200" cy="262" r="78"/>
    <circle cx="290" cy="232" r="96"/>
    <circle cx="370" cy="292" r="62"/>
    <circle cx="150" cy="312" r="56"/>
    <rect x="150" y="290" width="220" height="78" rx="39"/>
  </g>

  <!-- connection: one hub reaching out to everything, the "one connector" -->
  <g stroke="url(#logo-node)" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M262 280 L262 214"/>
    <path d="M262 280 L203 322"/>
    <path d="M262 280 L321 322"/>
  </g>
  <g fill="url(#logo-node)">
    <circle cx="262" cy="280" r="27"/>
    <circle cx="262" cy="210" r="17"/>
    <circle cx="200" cy="325" r="17"/>
    <circle cx="324" cy="325" r="17"/>
  </g>
  <g fill="#ffffff">
    <circle cx="262" cy="280" r="10"/>
    <circle cx="262" cy="210" r="6"/>
    <circle cx="200" cy="325" r="6"/>
    <circle cx="324" cy="325" r="6"/>
  </g>
</svg>
<text x="640" y="296" text-anchor="middle" font-size="30" font-weight="600" fill="#a1a1a6" letter-spacing="0.5">iCloud MCP</text>
<text x="640" y="392" text-anchor="middle" font-size="84" font-weight="700" fill="#f5f5f7" letter-spacing="-2.5">Your iCloud. <tspan fill="url(#word)">In Claude.</tspan></text>
<text x="640" y="456" text-anchor="middle" font-size="27" fill="#a1a1a6">Mail, Calendar, Contacts, Reminders, Notes and iCloud Drive.</text>
<text x="640" y="494" text-anchor="middle" font-size="27" fill="#a1a1a6">Private by design. It asks before anything leaves.</text>
<text x="640" y="556" text-anchor="middle" font-size="19" fill="#86868b" letter-spacing="1.5">65 TOOLS  ·  ONE CONNECTOR  ·  RUNS ON YOUR OWN MACHINE</text>

</svg>
