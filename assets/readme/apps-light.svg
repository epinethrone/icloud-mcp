  <text x="476" y="586" font-size="30" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">Notes</text>
  <text x="476" y="624" font-size="20" fill="#6e6e73">Read, edit and organise</text>
  <text x="476" y="652" font-size="20" fill="#6e6e73">into folders.</text>
  <text x="476" y="682" font-size="14" font-weight="600" fill="#86868b" letter-spacing="1.2">WITH THE MAC HELPER</text>
</g>
