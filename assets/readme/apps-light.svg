  <text x="892" y="586" font-size="30" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">iCloud Drive</text>
  <text x="892" y="624" font-size="20" fill="#6e6e73">Search inside documents,</text>
  <text x="892" y="652" font-size="20" fill="#6e6e73">send, write and tidy files.</text>
  <text x="892" y="682" font-size="14" font-weight="600" fill="#86868b" letter-spacing="1.2">WITH THE MAC HELPER</text>
</g>
