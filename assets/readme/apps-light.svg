  <text x="804" y="816" text-anchor="end" font-size="16" fill="#86868b">tools</text>
  <text x="476" y="882" font-size="30" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">Messages</text>
  <text x="476" y="920" font-size="20" fill="#6e6e73">Read and search your chats.</text>
  <text x="476" y="948" font-size="20" fill="#6e6e73">Sending waits for your OK.</text>
  <text x="476" y="978" font-size="14" font-weight="600" fill="#86868b" letter-spacing="1.2">WITH THE MAC HELPER</text>
</g>
