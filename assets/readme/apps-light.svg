  <text x="388" y="788" text-anchor="end" font-size="44" font-weight="700" fill="#1d1d1f" letter-spacing="-1">2</text>
  <text x="388" y="816" text-anchor="end" font-size="16" fill="#86868b">tools</text>
  <text x="60" y="882" font-size="30" font-weight="700" fill="#1d1d1f" letter-spacing="-0.5">Maps</text>
  <text x="60" y="920" font-size="20" fill="#6e6e73">Travel times by bike, car,</text>
  <text x="60" y="948" font-size="20" fill="#6e6e73">foot or transit. Find places.</text>
  <text x="60" y="978" font-size="14" font-weight="600" fill="#86868b" letter-spacing="1.2">WITH THE MAC HELPER</text>
</g>
