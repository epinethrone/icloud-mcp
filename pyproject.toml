[project]
name = "icloud-mcp"
version = "0.1.0"
description = "Remote MCP server for iCloud Mail (IMAP/SMTP), Calendar (CalDAV) and Contacts (CardDAV), with built-in single-user OAuth for Claude custom connectors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "imapclient>=3.0",
    "caldav>=2.0",
    "icalendar>=6.1",
    "html2text>=2024.2.26",
    "python-dateutil>=2.9",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "aiosmtpd>=1.4", "radicale>=3.2"]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"
icloud-mcp-selftest = "icloud_mcp.selftest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icloud_mcp = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
