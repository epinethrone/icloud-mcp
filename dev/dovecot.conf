# Minimal single-user Dovecot for local integration tests (IMAP on 127.0.0.1:1143, no TLS).
# Dovecot 2.4 configuration: the Ubuntu 26 runner image ships 2.4.x, which rejects 2.3 syntax outright.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols = imap
listen = 127.0.0.1
base_dir = /tmp/icmcp-dev/run
log_path = /tmp/icmcp-dev/dovecot.log
ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login
first_valid_uid = 1
mail_driver = maildir
mail_path = /tmp/icmcp-dev/mail/%{user}
passdb static {
  password = testpass
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /tmp/icmcp-dev/mail/%{user}
  }
}
service imap-login {
  inet_listener imap {
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox "Sent Messages" {
    special_use = \Sent
    auto = create
  }
  mailbox "Deleted Messages" {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}
