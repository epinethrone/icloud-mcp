# Minimal single-user Dovecot for local integration tests (IMAP on 127.0.0.1:1143, no TLS).
protocols = imap
listen = 127.0.0.1
base_dir = /tmp/icmcp-dev/run
log_path = /tmp/icmcp-dev/dovecot.log
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/tmp/icmcp-dev/mail/%n
first_valid_uid = 1
passdb {
  driver = static
  args = password=testpass
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/tmp/icmcp-dev/mail/%n
}
service imap-login {
  inet_listener imap {
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox "Sent Messages" {
    special_use = \Sent
    auto = create
  }
  mailbox "Deleted Messages" {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}
