name: Publish

# Runs when a GitHub release is published. Builds the package, publishes it to PyPI through trusted publishing
# (no stored token), then lists the new version in the official MCP Registry (GitHub OIDC, no stored token either).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package and server.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          srv=$(python -c "import json; d=json.load(open('server.json')); print(d['version'], d['packages'][0]['version'])")
          echo "tag=$tag pyproject=$pkg server.json=$srv"
          [ "$tag" = "$pkg" ] && [ "$srv" = "$tag $tag" ]
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/icloud-mcp-server/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  claude-desktop-bundle:
    # One-click install for Claude Desktop: icloud-mcp-<version>.mcpb attached to the release. Built after PyPI because
    # the bundle pins icloud-mcp-server==<version> and Claude Desktop installs it from there.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - run: python -m pip install .
      - run: python packaging/mcpb/build.py --out dist-mcpb
      - name: Validate the manifest with the official mcpb CLI
        run: |
          mkdir check && cd check && unzip -q ../dist-mcpb/*.mcpb
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcpb/*.mcpb --clobber

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install mcp-publisher
        run: |
          # A fixed release, never "latest": what runs with the publishing credential must not change under us. Dependabot
          # cannot follow this one, so bump it by hand: https://github.com/modelcontextprotocol/registry/releases
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait until PyPI serves the new version
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/icloud-mcp-server/${GITHUB_REF_NAME#v}/json" >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
