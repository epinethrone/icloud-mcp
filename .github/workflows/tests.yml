name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        # (Node runs the Notes and Reminders scripts against a fake object model)
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[test]"
      - name: Offline tests
        run: pytest tests --ignore=tests/integration -q

  # Integration tests and the benchmark against a local Dovecot + SMTP sink + Radicale. A failing integration test fails the
  # job; the benchmark writes its tables to the job summary and uploads them (gh run download <id> -n bench).
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dovecot-imapd
          pip install -e ".[test]"
      - name: Start the local stack
        run: sudo env "PATH=$PATH" bash dev/start_local_stack.sh
      - name: Integration tests
        run: pytest tests/integration -q
      - name: Benchmark
        run: |
          python dev/bench.py --local --runs 5 --idle-calls 5 --gap 20 --out bench.md --json bench.json
          python dev/bench.py --local --no-seed --runs 5 --idle-calls 0 --latency-ms 40 --out bench-40ms.md --json bench-40ms.json
          python dev/tool_surface.py > surface.md
          cat bench.md bench-40ms.md surface.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: bench
          path: |
            bench*.md
            bench*.json
            surface.md
