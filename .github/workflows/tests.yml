name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4          # runs the Notes and Reminders scripts against a fake object model
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[test]"
      - name: Offline tests
        run: pytest tests --ignore=tests/integration -q
