name: PR-Agent review

# AI review of every pull request from this repository (PR-Agent, https://github.com/The-PR-Agent/pr-agent), using a
# free NVIDIA NIM key (build.nvidia.com) stored as the NVIDIA_API_KEY repository secret. Reviews run automatically; it also answers /review, /improve,
# /describe and /ask comments, but only from the owner and collaborators, so strangers cannot spend the key.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false   # a push must not cancel a review that is already running (pushes themselves are skipped)

jobs:
  pr_agent:
    # Same-repository PRs only (fork PRs get no secrets), never bots, and comment commands only from people with access.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
          && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Note the start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: PR-Agent
        uses: The-PR-Agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b  # v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_API_BASE: https://integrate.api.nvidia.com/v1
          # Free NVIDIA NIM endpoint, models proven by a direct /chat/completions call on 11 Nov 2026.
          # nemotron-3-ultra (the previous pick) answered 503 "Service temporarily overloaded", then an empty
          # response, which is what broke the reviewer. The models below really answer:
          #  - super-vl-120b-a12b: best quality, but it thinks by default and spends the whole max_tokens budget on
          #    reasoning, returning empty content. reasoning_effort=none turns that off and it answers in seconds.
          #  - bolt-e4b: small, answers immediately with no special parameters; the safety net.
          CONFIG__MODEL: nvidia_nim/nvidia/nemotron-3.5-super-vl-120b-a12b
          CONFIG__FALLBACK_MODELS: '["nvidia_nim/nvidia/nemotron-3.5-bolt-e4b"]'
          CONFIG__REASONING_EFFORT: "none"
          CONFIG__ADDITIONAL_REASONING_EFFORT_MODELS: '["nvidia/nemotron-3.5-super-vl-120b-a12b"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "131072"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"   # code suggestions only on request: comment /improve
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"   # keep the human-written PR description
          PR_REVIEWER__EXTRA_INSTRUCTIONS: >-
            This is a single-owner MCP server that gives AI agents access to someone's iCloud Mail, Calendar, Contacts,
            Reminders, Notes and Drive; much of what it reads is written by strangers. Review it as security-sensitive code.
            Most important: (1) the send, invitation, permanent-delete, read-only and ENABLE_* gates must hold on every code
            path, including retries and indirect paths; (2) text from mail, events, contacts, notes and files must never
            become code, shell or AppleScript/JXA, file paths outside the allowed root, or fetched URLs; (3) passwords,
            tokens and account ids must never reach logs, errors or tool results; (4) nothing is deleted permanently or
            overwritten silently (ETags, Trash / Recently Deleted); (5) no tool may act on a different message, event or
            contact than the caller meant (mail uids need UIDVALIDITY). iCloud quirks that are intentional: no IMAP MOVE
            (COPY + \Deleted + UID EXPUNGE of exactly those uids), CalDAV UID REPORT answers 412, the CardDAV home set can be
            on another host. Skip formatting nits and generic advice without a concrete case.
          PR_CODE_SUGGESTIONS__EXTRA_INSTRUCTIONS: >-
            Only suggest changes that fix a real bug, a security gap or a clear reliability problem. No style-only or
            renaming suggestions. Keep the existing idiom: small pure helpers, type hints, offline tests.
      # PR-Agent exits successfully even when every model fails, which hid a broken reviewer for days. Fail loudly instead.
      - name: Check a review was posted
        # only where it reviews automatically; pushes to an open pull request are skipped by PR-Agent itself
        if: github.event_name == 'pull_request' && github.event.action != 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARTED: ${{ steps.start.outputs.at }}
        run: |
          posted=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"pr-agent:review\")) | select(.updated_at >= \"$STARTED\")] | length")
          if [ "${posted:-0}" -eq 0 ]; then
            echo "::error::PR-Agent posted no review: every model failed (see the PR-Agent step log for the model errors)."
            exit 1
          fi
